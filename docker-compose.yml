version: "3.9"

services:
  dashboard:
    build:
      context: ./dashboard
    container_name: dolibarr-dashboard
    ports:
      - "8080:8080"
    environment:
      DASHBOARD_CONFIG: /config/instances.yml
    volumes:
      - ./dashboard/config/instances.yml:/config/instances.yml:ro
    depends_on:
      - dolibarr16
      - dolibarr17
      - dolibarr18
      - dolibarr19
      - dolibarr20
      - dolibarr21
      - dolibarr22

  dolibarr16:
    image: dolibarr/dolibarr:16
    container_name: dolibarr16
    depends_on:
      - db16
    ports:
      - "8016:80"
    environment:
      DOLI_DB_HOST: db16
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: ${DOLI_DB_PASSWORD}
      DOLI_DB_NAME: dolibarr16
      DOLI_URL_ROOT: http://localhost:8016
    volumes:
      - ./dolibarr/16/htdocs:/var/www/html
      - ./custom-modules:/var/www/html/custom

  db16:
    image: mariadb:10.6
    container_name: dolibarr16-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dolibarr16
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: ${DOLI_DB_PASSWORD}
    volumes:
      - db16-data:/var/lib/mysql

  dolibarr17:
    image: dolibarr/dolibarr:17
    container_name: dolibarr17
    depends_on:
      - db17
    ports:
      - "8017:80"
